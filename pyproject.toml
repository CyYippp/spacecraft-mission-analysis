[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spacecraft-mission-analysis"
version = "0.1.0"
description = "Archived TLE to TEME SGP4 orbit kernel"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "astropy==7.2.1",
    "sgp4==2.27",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
dev = ["pytest==9.1.1", "ruff==0.16.10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
